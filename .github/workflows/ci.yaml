name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Proto Validation & Stub Generation ──────────────────────────────
  proto-lint:
    name: Protobuf Lint & Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto/
      - run: buf generate proto/ --template proto/buf.gen.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: proto-stubs
          path: gen/

  # ── OpenAPI Schema Validation ────────────────────────────────────────
  openapi-lint:
    name: OpenAPI Spectral Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # FIX #24: Pin spectral version to prevent CI breakage on new releases
      - run: npm install -g @stoplight/spectral-cli@6.11.1
      - run: spectral lint openapi/*.yaml --ruleset openapi/.spectral.yaml

  # ── Matrix Unit Tests ────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            language: node
            path: backend
          - service: ai-service
            language: python
            path: ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js with caching
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Run tests (Node.js)
        if: matrix.language == 'node'
        run: |
          cd ${{ matrix.path }}
          npm ci --legacy-peer-deps
          npm test
        env:
          JWT_SECRET: test_secret_12345
          JWT_REFRESH_SECRET: test_refresh_secret_12345
      - name: Setup Python with caching
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'
      - name: Run tests (Python)
        if: matrix.language == 'python'
        run: |
          cd ${{ matrix.path }}
          pip install -r requirements.txt
          pytest tests/ --cov

  # ── Helm Chart Lint & Validation ──────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
      - run: |
          if [ -d "helm" ]; then
            for chart in helm/*/; do
              if [ -f "$chart/Chart.yaml" ]; then
                echo "Linting $chart"
                helm dependency build $chart 2>/dev/null || true
                helm lint $chart
              fi
            done
          fi

  # ── FIX #10: Docker Image Build Validation ────────────────────────────
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
          - service: frontend
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aurabank-${{ matrix.service }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── FIX #11: CD — Push Images to GHCR on main branch ─────────────────
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [test, docker-build, helm-lint]
    # Only run on push to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
          - service: frontend
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
