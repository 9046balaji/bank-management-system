apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-microservices
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/9046balaji/bank-management-system.git'
    targetRevision: HEAD
    path: helm/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
