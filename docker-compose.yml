networks:
  aurabank-network:
    driver: bridge

services:
  # ==========================================
  # DATABASE SERVICES
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: aurabank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aurabank}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/schema_updates.sql:/docker-entrypoint-initdb.d/02-schema_updates.sql:ro
      - ./database/ledger_schema.sql:/docker-entrypoint-initdb.d/03-ledger_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aurabank}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  redis:
    image: redis:7-alpine
    container_name: aurabank-redis
    restart: unless-stopped
    # FIX #3: Redis auth | FIX #12: AOF persistence
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aurabank-ai-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=${FLASK_ENV:-production}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurabank-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_NAME=${POSTGRES_DB:-aurabank}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - ML_API_URL=${ML_API_URL:-http://ai-service:5001}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - PORT=${PORT:-5000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); })\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: aurabank-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  # ==========================================
  # MONITORING & OBSERVABILITY SERVICES
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: aurabank-node-exporter
    restart: on-failure:5
    ports:
      - "9100:9100"
    # FIX #23: mount udev for complete disk metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev/data:/run/udev/data:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - aurabank-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: aurabank-cadvisor
    # FIX #22: changed from unless-stopped to on-failure to prevent infinite crash loop
    restart: on-failure:5
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
      - '--disable_metrics=disk,diskIO'
    ports:
      - "8080:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    # FIX #6: privileged + /dev/kmsg for OOM detection
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    # FIX #8: Added healthcheck
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - aurabank-network

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: aurabank-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # FIX #13: Add retention policy
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
    depends_on:
      - node-exporter
      - backend
      - ai-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: aurabank-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - aurabank-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: aurabank-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # FIX #2: Use env vars instead of hardcoded credentials
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  # ==========================================
  # OPENTELEMETRY & JAEGER TRACING
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: aurabank-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC Model
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      # FIX #4: Remove localhost:4317 OTLP target — Jaeger all-in-one IS the OTLP receiver,
      # traffic flows FROM app → otel-collector → jaeger (not the reverse)
    # FIX #8: Added healthcheck
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - aurabank-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: aurabank-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector/otelcol-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - jaeger
    # FIX #8: Added healthcheck
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # FIX #7: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    # FIX #16: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - aurabank-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: