openapi: 3.0.3
info:
  title: AuraBank Payment & Transfer Service API
  version: 1.0.0
  description: Wire transfers, P2P payments, ATM tokens, and Idempotent transactions
  contact:
    name: AuraBank Core Banking Team
    email: banking@aurabank.internal
servers:
  - url: http://localhost:5000/api
    description: Local Dev Server
paths:
  /transactions/transfer:
    post:
      summary: Initiate money transfer
      operationId: transferMoney
      description: Initiates a wire or P2P transfer with strict idempotency enforcement
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          description: Client-generated unique key for exact-once processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer executed or idempotent replay returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '422':
          description: Transfer rejected by AI Fraud engine or insufficient funds
components:
  schemas:
    TransferRequest:
      type: object
      required:
        - to_account_number
        - amount
      properties:
        to_account_number:
          type: string
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          default: USD
        description:
          type: string
    TransferResponse:
      type: object
      properties:
        success:
          type: boolean
        transaction_id:
          type: string
        status:
          type: string
        receipt:
          type: object
