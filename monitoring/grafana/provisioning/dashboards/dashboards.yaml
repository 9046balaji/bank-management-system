# monitoring/grafana/provisioning/dashboards/dashboards.yaml
# =============================================================
# Grafana Dashboard Provisioning — Local Dev
# =============================================================
# Auto-loads all dashboards from /var/lib/grafana/dashboards/
# =============================================================

apiVersion: 1

providers:
  - name: "AuraBank Dashboards"
    orgId: 1
    folder: "AuraBank"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
