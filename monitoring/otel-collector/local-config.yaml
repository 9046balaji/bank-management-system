# monitoring/otel-collector/local-config.yaml
# =============================================================
# OTel Collector — Local Dev Config (Phase 0/4)
# =============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'aurabank-backend'
          scrape_interval: 10s
          static_configs:
            - targets: ['backend:5000']
        - job_name: 'flask-ai-service'
          scrape_interval: 15s
          static_configs:
            - targets: ['ai-service:5001']

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 200ms, 500ms, 1s]
    dimensions:
      - name: http.method
      - name: http.status_code

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: k8s.cluster.name
        value: "aurabank-local"
        action: upsert
      - key: deployment.environment
        value: "local"
        action: upsert

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 500
    policies:
      - name: always-sample-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: always-sample-slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: probabilistic-background
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "aurabank"

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlp/jaeger, spanmetrics, debug]

    metrics:
      receivers: [otlp, prometheus, spanmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
