# monitoring/prometheus/alerts.yml
# Alertmanager rules for AuraBank platform SRE & Production Hardening

groups:
  - name: payment_slo_alerts
    rules:
      - alert: PaymentAPIErrorBudgetBurnRate
        expr: (1 - slo:payment_api:success_rate:5m) / (1 - 0.999) > 2
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Payment API burning error budget at > 2x rate"
          description: "Payment API 5-minute success rate dropped below 99.9% target"
          runbook: "https://wiki.aurabank.internal/runbooks/payment-slo-burn"

      - alert: LedgerGRPCP99LatencyHigh
        expr: slo:ledger_grpc:p99_latency_seconds:5m > 0.15
        for: 5m
        labels:
          severity: warning
          team: core-banking
        annotations:
          summary: "Ledger gRPC p99 latency exceeds 150ms"
          description: "Core Ledger Service double-entry execution latency is degraded"

      - alert: FraudEngineFallbackRateHigh
        expr: slo:fraud_engine:fallback_rate:5m > 0.02
        for: 5m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "Fraud engine fallback rate > 2% — model may be unhealthy"
          description: "Payment Service falling back to rule-based evaluation due to Fraud Engine timeouts/failures"

      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumer_group_lag) by (topic, group) > 1000
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag > 1000 messages on {{ $labels.topic }}"

      - alert: OutboxEventStuck
        expr: outbox:events_stuck:seconds_since_last_process > 120
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Outbox events stuck for > 2 minutes — Kafka may be unreachable"
